<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div id="login-form">
        <h2>Login</h2>
        <div id="login-success" class="success"></div>
        <div class="form-group">
          <input type="text" id="login-email" placeholder="Email or Username" />
          <div id="login-email-error" class="error"></div>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" />
          <div id="login-password-error" class="error"></div>
        </div>
        <button id="login-btn">Login</button>
        <div class="toggle">
          Dont have an account? <span id="show-register">Register</span>
        </div>
      </div>

      <div id="register-form" class="hidden">
        <h2>Register</h2>
        <div id="register-success" class="success"></div>
        <div class="form-group">
            <input type="text" id="reg-username" placeholder="Username" />
            <div id="username-error" class="error"></div>
        </div>
        <div class="form-group">
            <input type="email" id="reg-email" placeholder="Email" />
            <div id="email-error" class="error"></div>
        </div>
        <div class="form-group">
            <input type="password" id="reg-password" placeholder="Password" />
            <div id="password-error" class="error"></div>
        </div>
        <div class="form-group">
            <input type="password" id="reg-confirm" placeholder="Confirm Password" />
            <div id="confirm-error" class="error">
        </div>
        <button id="register-btn">Register</button>
        <div class="toggle">Already have an account? <span id="show-login"> Login</span>
        </div>
       </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
